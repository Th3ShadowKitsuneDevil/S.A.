<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Edge Cache 15 — Local</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Edge Cache 15</h1>
        <div class="sub">Local • every 15 minutes</div>
      </div>
      <label class="toggle">
        <input id="enabled" type="checkbox">
        <span>Enabled</span>
      </label>
    </header>

    <section class="card">
      <label class="option">
        <input id="cacheStorage" type="checkbox">
        <span>
          <strong>Also clear Cache Storage</strong>
          <small>Off by default. HTTP cache is always the primary cleanup target.</small>
        </span>
      </label>
    </section>

    <button id="clearNow" type="button">Clear cache now</button>

    <section class="status">
      <div id="result">Checking status…</div>
      <div id="last" class="muted"></div>
      <div id="next" class="muted"></div>
    </section>

    <p class="safe">Preserves cookies, login sessions, passwords, browsing history, and service-worker registrations.</p>
  </main>

  <script src="popup.js"></script>
</body>
</html>
